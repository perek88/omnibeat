name: Build OmniBeat Custom APK

on:
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out OmniBeat fork
        uses: actions/checkout@v4

      - name: Apply OmniBeat Custom v3.4.1 Interactive Spotify overlay
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 -d > /tmp/omnibeat-custom-overlay-v341.tar.gz
          echo '940f32c1212d265e2460a47b8f91c0968796ce55e4f6ed1cc960350dd8bee791  /tmp/omnibeat-custom-overlay-v341.tar.gz' | sha256sum -c -
          tar xzf /tmp/omnibeat-custom-overlay-v341.tar.gz -C "$GITHUB_WORKSPACE"
          echo "Applied custom source overlay v3.4.1 (fixed gesture coroutines, unified Back/chevron, Spotify plus, new list location, loading status)."

      - name: Find logos for bundled stations
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/res/raw
          python3 - <<'PYLOGOS'
          import json
          import re
          import time
          import urllib.parse
          import urllib.request
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from pathlib import Path
          from urllib.parse import urlparse

          source = Path('app/src/main/res/raw/default_stations.txt')
          out = Path('app/src/main/res/raw/default_station_logos.json')

          blocks = [b for b in re.split(r'\r?\n\s*\r?\n', source.read_text(encoding='utf-8').strip()) if b.strip()]
          stations = []
          for block in blocks:
              lines = [x.strip() for x in block.splitlines() if x.strip()]
              if len(lines) >= 2:
                  stations.append((lines[0], lines[1]))

          bases = [
              'https://de1.api.radio-browser.info',
              'https://de2.api.radio-browser.info',
              'https://fi1.api.radio-browser.info',
          ]
          headers = {'User-Agent': 'OmniBeat-Custom-Build/1.0', 'Accept': 'application/json'}

          def read_json(path):
              last = None
              for base in bases:
                  try:
                      req = urllib.request.Request(base + path, headers=headers)
                      with urllib.request.urlopen(req, timeout=7) as r:
                          return json.loads(r.read().decode('utf-8'))
                  except Exception as e:
                      last = e
              raise last or RuntimeError('Radio Browser request failed')

          def norm_name(value):
              return re.sub(r'[^a-z0-9]+', '', value.lower())

          def host(value):
              try:
                  return (urlparse(value).hostname or '').lower().removeprefix('www.')
              except Exception:
                  return ''

          def valid_logo(value):
              return isinstance(value, str) and value.strip().lower().startswith(('http://','https://'))

          def choose_by_name(title, stream_url, rows):
              target = norm_name(title)
              target_host = host(stream_url)
              scored = []
              for row in rows:
                  logo = (row.get('favicon') or '').strip()
                  if not valid_logo(logo):
                      continue
                  name = (row.get('name') or '').strip()
                  n = norm_name(name)
                  row_url = (row.get('url_resolved') or row.get('url') or '').strip()
                  row_host = host(row_url)
                  score = 0
                  if n == target and target:
                      score += 100
                  elif target and (target in n or n in target) and min(len(target), len(n)) >= 6:
                      score += 55
                  if target_host and row_host and (target_host == row_host or target_host.endswith('.'+row_host) or row_host.endswith('.'+target_host)):
                      score += 80
                  if score >= 80:
                      scored.append((score, logo))
              return max(scored, default=(0, None))[1]

          def lookup(item):
              title, stream_url = item
              try:
                  by_url = '/json/stations/byurl?' + urllib.parse.urlencode({'url': stream_url})
                  rows = read_json(by_url)
                  for row in rows:
                      logo = (row.get('favicon') or '').strip()
                      if valid_logo(logo):
                          return stream_url, logo, 'url'

                  search = '/json/stations/search?' + urllib.parse.urlencode({
                      'name': title,
                      'hidebroken': 'false',
                      'order': 'votes',
                      'reverse': 'true',
                      'limit': '12',
                  })
                  rows = read_json(search)
                  logo = choose_by_name(title, stream_url, rows)
                  if logo:
                      return stream_url, logo, 'name'
              except Exception as e:
                  return stream_url, None, f'error:{type(e).__name__}'
              return stream_url, None, 'none'

          logos = {}
          stats = {'url': 0, 'name': 0, 'none': 0, 'error': 0}
          with ThreadPoolExecutor(max_workers=6) as pool:
              futures = [pool.submit(lookup, item) for item in stations]
              for i, future in enumerate(as_completed(futures), 1):
                  stream_url, logo, method = future.result()
                  if logo:
                      logos[stream_url] = logo
                      stats[method] = stats.get(method, 0) + 1
                  elif method.startswith('error:'):
                      stats['error'] += 1
                  else:
                      stats['none'] += 1
                  if i % 20 == 0 or i == len(futures):
                      print(f'Logo lookup: {i}/{len(futures)}; found {len(logos)}')

          out.write_text(json.dumps(logos, ensure_ascii=False, indent=2, sort_keys=True), encoding='utf-8')
          print(f'Logo lookup complete: {len(logos)}/{len(stations)} logos. Details: {stats}')
          PYLOGOS
          test -f app/src/main/res/raw/default_station_logos.json
          head -c 300 app/src/main/res/raw/default_station_logos.json || true
          echo

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Prepare Android 37.0 SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install \
            'platform-tools' \
            'platforms;android-37.0' \
            'build-tools;37.0.0'
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"

      # For an in-place update, provide the SAME debug keystore that signed
      # the previously installed OmniBeat Custom APK. Otherwise this workflow
      # still produces an APK, but the new debug certificate will not match.
      - name: Restore stable APK signing key (optional)
        shell: bash
        env:
          SIGNING_KEY_B64: ${{ secrets.OMNIBEAT_DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -n "$SIGNING_KEY_B64" ]; then
            mkdir -p "$HOME/.android"
            printf '%s' "$SIGNING_KEY_B64" | base64 -d > "$HOME/.android/debug.keystore"
            chmod 600 "$HOME/.android/debug.keystore"
            echo 'Restored signing key for in-place updates.'
          else
            echo '::warning::No signing keystore configured. APK update may be rejected due to a different signing certificate.'
          fi

      - name: Build GitHub debug APK
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleGithubDebug

      - name: Prepare APK
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/github/debug/app-github-debug.apk
          test -f "$APK"
          mkdir -p output
          cp "$APK" output/OmniBeat_Custom_1.9.2-custom3.4.1.apk
          cp app/src/main/res/raw/default_station_logos.json output/station_logos_found.json
          sha256sum output/OmniBeat_Custom_1.9.2-custom3.4.1.apk | tee output/SHA256.txt
          "${ANDROID_SDK_ROOT}/build-tools/37.0.0/apksigner" verify --print-certs "$APK" | tee output/APK_signature.txt

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: OmniBeat-Custom-v3.4.1-Interactive-Spotify-APK
          path: output/*
          if-no-files-found: error
          retention-days: 14

      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: OmniBeat-Custom-v3.4.1-build-reports
          path: |
            app/build/reports/**
            app/build/outputs/logs/**
          if-no-files-found: ignore
          retention-days: 7
