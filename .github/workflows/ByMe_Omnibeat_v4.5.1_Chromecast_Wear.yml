name: Build ByMe Omnibeat v4.5.1 Android + Wear OS Tile

on:
  workflow_dispatch:
    inputs:
      allow_fresh_install:
        description: 'Allow APK with temporary signing key (NOT an update; existing data may be lost)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out OmniBeat fork
        uses: actions/checkout@v4

      - name: Apply ByMe Omnibeat v4.5.1 Android + Wear + Cast + rename
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 -d > /tmp/omnibeat-custom-overlay-v451.tar.gz| base64 -d > /tmp/omnibeat-custom-overlay-v451.tar.gz
          echo '7c18c3f6c87eae14101fe2059f73b2b0d3b37a50b714010e71f17e7956f834f9  /tmp/omnibeat-custom-overlay-v451.tar.gz' | sha256sum -c -
          tar xzf /tmp/omnibeat-custom-overlay-v451.tar.gz -C "$GITHUB_WORKSPACE"
          echo "Applied v4.5.1: display-name change only over v4.5.0; Chromecast, artwork retries, Wear OS and signing retained."

      - name: Find logos for bundled stations
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/res/raw
          python3 - <<'PYLOGOS'
          import json
          import re
          import time
          import urllib.parse
          import urllib.request
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from pathlib import Path
          from urllib.parse import urlparse

          source = Path('app/src/main/res/raw/default_stations.txt')
          out = Path('app/src/main/res/raw/default_station_logos.json')

          blocks = [b for b in re.split(r'\r?\n\s*\r?\n', source.read_text(encoding='utf-8').strip()) if b.strip()]
          stations = []
          for block in blocks:
              lines = [x.strip() for x in block.splitlines() if x.strip()]
              if len(lines) >= 2:
                  stations.append((lines[0], lines[1]))

          bases = [
              'https://de1.api.radio-browser.info',
              'https://de2.api.radio-browser.info',
              'https://fi1.api.radio-browser.info',
          ]
          headers = {'User-Agent': 'OmniBeat-Custom-Build/1.0', 'Accept': 'application/json'}

          def read_json(path):
              last = None
              for base in bases:
                  try:
                      req = urllib.request.Request(base + path, headers=headers)
                      with urllib.request.urlopen(req, timeout=7) as r:
                          return json.loads(r.read().decode('utf-8'))
                  except Exception as e:
                      last = e
              raise last or RuntimeError('Radio Browser request failed')

          def norm_name(value):
              return re.sub(r'[^a-z0-9]+', '', value.lower())

          def host(value):
              try:
                  return (urlparse(value).hostname or '').lower().removeprefix('www.')
              except Exception:
                  return ''

          def valid_logo(value):
              return isinstance(value, str) and value.strip().lower().startswith(('http://','https://'))

          def choose_by_name(title, stream_url, rows):
              target = norm_name(title)
              target_host = host(stream_url)
              scored = []
              for row in rows:
                  logo = (row.get('favicon') or '').strip()
                  if not valid_logo(logo):
                      continue
                  name = (row.get('name') or '').strip()
                  n = norm_name(name)
                  row_url = (row.get('url_resolved') or row.get('url') or '').strip()
                  row_host = host(row_url)
                  score = 0
                  if n == target and target:
                      score += 100
                  elif target and (target in n or n in target) and min(len(target), len(n)) >= 6:
                      score += 55
                  if target_host and row_host and (target_host == row_host or target_host.endswith('.'+row_host) or row_host.endswith('.'+target_host)):
                      score += 80
                  if score >= 80:
                      scored.append((score, logo))
              return max(scored, default=(0, None))[1]

          def lookup(item):
              title, stream_url = item
              try:
                  by_url = '/json/stations/byurl?' + urllib.parse.urlencode({'url': stream_url})
                  rows = read_json(by_url)
                  for row in rows:
                      logo = (row.get('favicon') or '').strip()
                      if valid_logo(logo):
                          return stream_url, logo, 'url'

                  search = '/json/stations/search?' + urllib.parse.urlencode({
                      'name': title,
                      'hidebroken': 'false',
                      'order': 'votes',
                      'reverse': 'true',
                      'limit': '12',
                  })
                  rows = read_json(search)
                  logo = choose_by_name(title, stream_url, rows)
                  if logo:
                      return stream_url, logo, 'name'
              except Exception as e:
                  return stream_url, None, f'error:{type(e).__name__}'
              return stream_url, None, 'none'

          logos = {}
          stats = {'url': 0, 'name': 0, 'none': 0, 'error': 0}
          with ThreadPoolExecutor(max_workers=6) as pool:
              futures = [pool.submit(lookup, item) for item in stations]
              for i, future in enumerate(as_completed(futures), 1):
                  stream_url, logo, method = future.result()
                  if logo:
                      logos[stream_url] = logo
                      stats[method] = stats.get(method, 0) + 1
                  elif method.startswith('error:'):
                      stats['error'] += 1
                  else:
                      stats['none'] += 1
                  if i % 20 == 0 or i == len(futures):
                      print(f'Logo lookup: {i}/{len(futures)}; found {len(logos)}')

          out.write_text(json.dumps(logos, ensure_ascii=False, indent=2, sort_keys=True), encoding='utf-8')
          print(f'Logo lookup complete: {len(logos)}/{len(stations)} logos. Details: {stats}')
          PYLOGOS
          test -f app/src/main/res/raw/default_station_logos.json
          head -c 300 app/src/main/res/raw/default_station_logos.json || true
          echo

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Prepare Android 37.0 SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install \
            'platform-tools' \
            'platforms;android-37.0' \
            'build-tools;37.0.0'
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"

      # A different signing certificate makes Android refuse an in-place update.
      # The private key for an already installed APK cannot be recovered from the APK.
      - name: Require persistent signing key for updates
        shell: bash
        env:
          SIGNING_KEY_B64: ${{ secrets.OMNIBEAT_DEBUG_KEYSTORE_BASE64 }}
          ALLOW_FRESH_INSTALL: ${{ inputs.allow_fresh_install }}
        run: |
          set -euo pipefail
          if [ -z "$SIGNING_KEY_B64" ]; then
            if [ "$ALLOW_FRESH_INSTALL" != 'true' ]; then
              echo '::error::Missing OMNIBEAT_DEBUG_KEYSTORE_BASE64 secret; refusing unsigned-for-updates build.'
              exit 1
            fi
            echo '::warning::This APK will be signed with a temporary debug key and can ONLY be installed cleanly.'
            echo 'OMNIBEAT_STABLE_KEYSTORE=false' >> "$GITHUB_ENV"
          else
            mkdir -p "$HOME/.android"
            printf '%s' "$SIGNING_KEY_B64" | base64 -d > "$HOME/.android/debug.keystore"
            chmod 600 "$HOME/.android/debug.keystore"
            keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey >/dev/null
            expected="$(keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey \
              | sed -n 's/^[[:space:]]*SHA256:[[:space:]]*//p' | head -n 1 | tr -d ':\r' | tr '[:upper:]' '[:lower:]')"
            if [[ ! "$expected" =~ ^[0-9a-f]{64}$ ]]; then
              echo '::error::Unable to read the signing certificate fingerprint.'
              exit 1
            fi
            echo "OMNIBEAT_EXPECTED_CERT=$expected" >> "$GITHUB_ENV"
            echo 'OMNIBEAT_STABLE_KEYSTORE=true' >> "$GITHUB_ENV"
            echo "Stable key certificate SHA-256: $expected"
          fi

      - name: Build GitHub debug APK
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleGithubDebug :wear:assembleDebug

      # Gradle's default debug APK was using a DIFFERENT signing key from the
      # restored $HOME/.android/debug.keystore in v3.7-v3.9. Re-sign the actual
      # final installable APK and refuse upload if certificates do not match.
      - name: Sign final APK with persistent key and VERIFY certificate
        if: env.OMNIBEAT_STABLE_KEYSTORE == 'true'
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/github/debug/app-github-debug.apk
          APKSIGNER="${ANDROID_SDK_ROOT}/build-tools/37.0.0/apksigner"
          test -f "$APK"
          "$APKSIGNER" sign \
            --ks "$HOME/.android/debug.keystore" \
            --ks-key-alias androiddebugkey \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out /tmp/omnibeat-stable-signed.apk \
            "$APK"
          "$APKSIGNER" verify --print-certs /tmp/omnibeat-stable-signed.apk | tee /tmp/omnibeat-signature-verification.txt
          actual="$(grep -m1 'certificate SHA-256 digest:' /tmp/omnibeat-signature-verification.txt | sed -E 's/.*digest:[[:space:]]*([0-9a-f]+).*/\1/')"
          if [ "$actual" != "$OMNIBEAT_EXPECTED_CERT" ]; then
            echo "::error::APK is NOT signed with persistent key. Expected $OMNIBEAT_EXPECTED_CERT but got $actual"
            exit 1
          fi
          mv /tmp/omnibeat-stable-signed.apk "$APK"
          echo "Verified FINAL APK certificate SHA-256: $actual"
          echo "### Verified stable APK signature: $actual" >> "$GITHUB_STEP_SUMMARY"

      - name: Sign Wear OS APK and validate pairing identity
        shell: bash
        run: |
          set -euo pipefail
          WATCH_APK=wear/build/outputs/apk/debug/wear-debug.apk
          PHONE_APK=app/build/outputs/apk/github/debug/app-github-debug.apk
          APKSIGNER="${ANDROID_SDK_ROOT}/build-tools/37.0.0/apksigner"
          AAPT="${ANDROID_SDK_ROOT}/build-tools/37.0.0/aapt"
          test -f "$WATCH_APK"
          if [ "${OMNIBEAT_STABLE_KEYSTORE:-false}" = 'true' ]; then
            "$APKSIGNER" sign \
              --ks "$HOME/.android/debug.keystore" \
              --ks-key-alias androiddebugkey \
              --ks-pass pass:android \
              --key-pass pass:android \
              --out /tmp/omnibeat-wear-signed.apk \
              "$WATCH_APK"
            mv /tmp/omnibeat-wear-signed.apk "$WATCH_APK"
          fi
          "$APKSIGNER" verify --print-certs "$WATCH_APK" | tee /tmp/omnibeat-wear-signature.txt
          "$APKSIGNER" verify --print-certs "$PHONE_APK" | tee /tmp/omnibeat-phone-signature.txt
          watch_cert="$(grep -m1 'certificate SHA-256 digest:' /tmp/omnibeat-wear-signature.txt | sed -E 's/.*digest:[[:space:]]*([0-9a-f]+).*/\1/')"
          phone_cert="$(grep -m1 'certificate SHA-256 digest:' /tmp/omnibeat-phone-signature.txt | sed -E 's/.*digest:[[:space:]]*([0-9a-f]+).*/\1/')"
          test "$watch_cert" = "$phone_cert" || { echo '::error::Phone/Wear signing certificates differ; Data Layer cannot pair.'; exit 1; }
          if [ "${OMNIBEAT_STABLE_KEYSTORE:-false}" = 'true' ]; then
            test "$watch_cert" = "$OMNIBEAT_EXPECTED_CERT" || { echo '::error::Wear signature differs from stable key'; exit 1; }
          fi
          watch_pkg="$("$AAPT" dump badging "$WATCH_APK" | sed -n "s/^package: name='\([^']*\)'.*/\1/p" | head -n1)"
          phone_pkg="$("$AAPT" dump badging "$PHONE_APK" | sed -n "s/^package: name='\([^']*\)'.*/\1/p" | head -n1)"
          test "$watch_pkg" = "$phone_pkg" || { echo '::error::Phone/Wear package ids differ; Wear Data Layer needs the same package.'; exit 1; }
          echo "Phone and Wear both signed: $watch_cert (package: $watch_pkg)" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Prepare APK
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/github/debug/app-github-debug.apk
          test -f "$APK"
          mkdir -p output
          cp "$APK" output/ByMe_Omnibeat_Android_v4.5.1.apk
          cp wear/build/outputs/apk/debug/wear-debug.apk output/ByMe_Omnibeat_Wear_OS_v4.5.1.apk
          sha256sum output/ByMe_Omnibeat_Wear_OS_v4.5.1.apk > output/Wear_SHA256.txt
          "${ANDROID_SDK_ROOT}/build-tools/37.0.0/apksigner" verify --print-certs output/ByMe_Omnibeat_Wear_OS_v4.5.1.apk > output/Wear_APK_signature.txt
          cp app/src/main/res/raw/default_station_logos.json output/station_logos_found.json
          sha256sum output/ByMe_Omnibeat_Android_v4.5.1.apk | tee output/SHA256.txt
          "${ANDROID_SDK_ROOT}/build-tools/37.0.0/apksigner" verify --print-certs "$APK" | tee output/APK_signature.txt
          if [ "${OMNIBEAT_STABLE_KEYSTORE:-false}" = 'true' ]; then
            actual="$(grep -m1 'certificate SHA-256 digest:' output/APK_signature.txt | sed -E 's/.*digest:[[:space:]]*([0-9a-f]+).*/\1/')"
            test "$actual" = "$OMNIBEAT_EXPECTED_CERT" || { echo '::error::Uploaded APK signing certificate mismatch'; exit 1; }
          fi
          echo '### ByMe Omnibeat APK identity' >> "$GITHUB_STEP_SUMMARY"
          "${ANDROID_SDK_ROOT}/build-tools/37.0.0/aapt" dump badging "$APK" | grep '^package:' | tee -a "$GITHUB_STEP_SUMMARY"
          grep 'certificate SHA-256 digest:' output/APK_signature.txt | tee -a "$GITHUB_STEP_SUMMARY"
          echo 'For an in-place update, Android requires the *same signing certificate* as the installed APK.' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: ByMe-Omnibeat-v4.5.1-Android-and-Wear-APK
          path: output/*
          if-no-files-found: error
          retention-days: 14

      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ByMe-Omnibeat-v4.5.1-build-reports
          path: |
            app/build/reports/**
            app/build/outputs/logs/**
            wear/build/reports/**
            wear/build/outputs/logs/**
          if-no-files-found: ignore
          retention-days: 7
