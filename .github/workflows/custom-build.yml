name: Build OmniBeat Custom APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/custom-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out OmniBeat fork
        uses: actions/checkout@v4

      - name: Apply OmniBeat Custom overlay
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 -d > /tmp/omnibeat-custom-overlay.tar.gz
          echo '1272f0b1d5d8c2298934bae1ae010b1e8bf9448ea77728a0605e9d4b01e7d80a  /tmp/omnibeat-custom-overlay.tar.gz' | sha256sum -c -
          tar xzf /tmp/omnibeat-custom-overlay.tar.gz -C "$GITHUB_WORKSPACE"
          echo "Applied custom source overlay."

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Prepare Android 37 SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          echo "Using Android SDK: $SDK_ROOT"
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" 'platform-tools' 'platforms;android-37' 'build-tools;37.0.0'
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"

      - name: Build GitHub debug APK
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleGithubDebug

      - name: Prepare APK
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/github/debug/app-github-debug.apk
          test -f "$APK"
          mkdir -p output
          cp "$APK" output/OmniBeat_Custom_1.9.2-custom1.apk
          sha256sum output/OmniBeat_Custom_1.9.2-custom1.apk | tee output/SHA256.txt

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: OmniBeat-Custom-APK
          path: output/*
          if-no-files-found: error
          retention-days: 14

      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: OmniBeat-Custom-build-reports
          path: |
            app/build/reports/**
            app/build/outputs/logs/**
          if-no-files-found: ignore
          retention-days: 7
